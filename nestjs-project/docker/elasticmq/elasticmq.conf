include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

generate-node-address = false

aws {
  region = us-east-1
  accountId = 000000000000
}

# Persisted queues take precedence over this file. After changing the queue
# definitions below, recreate the elasticmq-data volume.
messages-storage {
  enabled = true
}

queues {
  video-processing {
    defaultVisibilityTimeout = 120 seconds
    deadLettersQueue {
      name = "video-processing-dlq"
      maxReceiveCount = 4
    }
  }
  video-processing-dlq {}

  video-processing-test {
    defaultVisibilityTimeout = 120 seconds
    deadLettersQueue {
      name = "video-processing-test-dlq"
      maxReceiveCount = 4
    }
  }
  video-processing-test-dlq {}
}
